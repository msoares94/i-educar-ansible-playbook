---
postgresql__version: "{{ postgresql_version | default(14) }}"

postgresql__gpg_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgresql__apt_repo: "deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"

postgresql__extensions: []
postgresql__psycopg2: python3-psycopg2
postgresql__recreate_cluster: "{{ postgresql_recreate_cluster | default('true') }}"

postgresql__encoding: "{{ postgresql_encoding | default('UTF-8') }}"
postgresql__locale: "{{ postgresql_locale | default('pt_BR.UTF-8') }}"

postgresql__user: "postgres"
postgresql__group: "postgres"

postgresql__tuning_default:
  - option: shared_buffers
    value: 128MB
  - option: effective_cache_size
    value: 256MB
  - option: work_mem
    value: 4MB
  - option: maintenance_work_mem
    value: 64MB
  - option: checkpoint_completion_target
    value: 0.5
  - option: wal_buffers
    value: 4MB
  - option: default_statistics_target
    value: 100
  - option: random_page_cost
    value: 4.0

postgresql__tuning_2gb:
  - option: shared_buffers
    value: 512MB
  - option: effective_cache_size
    value: 1536MB
  - option: work_mem
    value: 4MB
  - option: maintenance_work_mem
    value: 128MB
  - option: checkpoint_completion_target
    value: 0.9
  - option: wal_buffers
    value: 16MB
  - option: default_statistics_target
    value: 100
  - option: random_page_cost
    value: 1.1

postgresql__tuning_4gb:
  - option: shared_buffers
    value: 1GB
  - option: effective_cache_size
    value: 3GB
  - option: work_mem
    value: 8MB
  - option: maintenance_work_mem
    value: 256MB
  - option: checkpoint_completion_target
    value: 0.9
  - option: wal_buffers
    value: 32MB
  - option: default_statistics_target
    value: 100
  - option: random_page_cost
    value: 1.1

postgresql__tuning_8gb:
  - option: shared_buffers
    value: 2GB
  - option: effective_cache_size
    value: 6GB
  - option: work_mem
    value: 16MB
  - option: maintenance_work_mem
    value: 512MB
  - option: checkpoint_completion_target
    value: 0.9
  - option: wal_buffers
    value: 64MB
  - option: default_statistics_target
    value: 100
  - option: random_page_cost
    value: 1.1

postgresql__tuning_12gb:
  - option: shared_buffers
    value: 3GB
  - option: effective_cache_size
    value: 9GB
  - option: work_mem
    value: 32MB
  - option: maintenance_work_mem
    value: 768MB
  - option: checkpoint_completion_target
    value: 0.9
  - option: wal_buffers
    value: 128MB
  - option: default_statistics_target
    value: 100
  - option: random_page_cost
    value: 1.1

postgresql__pg_hba_entries:
  - { type: local, database: all, user: postgres, address: '', auth_method: peer }
  - { type: local, database: all, user: all, address: '', auth_method: peer }
  - { type: host, database: all, user: all, address: '127.0.0.1/32', auth_method: md5 }
  - { type: host, database: all, user: all, address: all, auth_method: md5 }
  - { type: host, database: all, user: all, address: '::1/128', auth_method: md5 }
  - { type: local, database: replication, user: all, address: '', auth_method: peer }
  - { type: host, database: replication, user: all, address: '127.0.0.1/32', auth_method: md5 }
  - { type: host, database: replication, user: all, address: '::1/128', auth_method: md5 }

postgresql__users:
  - {
    name: "postgres",
    password: "postgres",
    encrypted: yes,
    expires: 'infinity',
    state: 'present',
    role_attr_flags: Superuser, Create role, Create DB, Replication, Bypass RLS,
    db: postgres
  }
  - {
    name: "test",
    password: "supersecure",
    encrypted: yes,
    expires: 'infinity',
    state: 'present',
    db: test
  }

postgresql__databases:
  - {
    name: test,
    lc_collate: 'pt_BR.UTF-8',
    lc_ctype: 'pt_BR.UTF-8',
    encoding: 'UTF-8',
    template: 'template0',
    owner: test,
    extension: [],
    state: 'present'
   }

postgresql__bin_path: "/usr/lib/postgresql/{{ postgresql__version }}/bin"
postgresql__data_work_dir: "/var/lib/postgresql/{{ postgresql__version }}/main"
postgresql__install_base_path: "/etc/postgresql/{{ postgresql__version }}/main"