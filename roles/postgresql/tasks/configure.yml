---
- name: Drop PostgreSQL cluster if needed (Ubuntu only)
  shell: pg_dropcluster --stop {{ postgresql__version }} main
  args:
    removes: "/etc/postgresql/{{ postgresql__version }}/main"
  when: ansible_distribution == 'Ubuntu' and postgresql__setup.changed and postgresql__recreate_cluster

- name: Create PostgreSQL cluster with UTF-8 (Ubuntu only)
  shell: >
    pg_createcluster -u "{{ postgresql__user }}" -g "{{ postgresql__group }}"
    --encoding "{{ postgresql__encoding }}"
    --locale="{{ postgresql__locale }}"
    --lc-collate="{{ postgresql__locale }}"
    {{ postgresql__version }} main
  args:
    creates: "/etc/postgresql/{{ postgresql__version }}/main"
  when: ansible_distribution == 'Ubuntu' and postgresql__setup.changed and postgresql__recreate_cluster

- name: Restart PostgreSQL after cluster recreation
  service:
    name: postgresql
    state: restarted
  when:
    - ansible_distribution == 'Ubuntu'
    - postgresql__setup.changed
    - postgresql__recreate_cluster

- name: Wait for PostgreSQL socket to be available
  wait_for:
    path: "/var/run/postgresql/.s.PGSQL.5432"
    state: present
    timeout: 60
  when:
    - ansible_distribution == 'Ubuntu'
    - postgresql__setup.changed
    - postgresql__recreate_cluster

- name: Select PostgreSQL tuning preset based on memory
  set_fact:
    postgresql__global_conf_selected: >-
      {{
        (
          postgresql__tuning_12gb
          if ansible_memtotal_mb >= 12000 else
          postgresql__tuning_8gb
          if ansible_memtotal_mb >= 8000 else
          postgresql__tuning_4gb
          if ansible_memtotal_mb >= 4000 else
          postgresql__tuning_2gb
          if ansible_memtotal_mb >= 2048 else
          postgresql__tuning_default
        ) | default([])
      }}

- name: Fail if no PostgreSQL tuning config is available
  fail:
    msg: "No PostgreSQL tuning configuration is available. Please check the variables in all.yml."
  when: postgresql__global_conf_selected | length == 0

- name: Apply all PostgreSQL config changes
  block:
    - name: Check include configuration
      lineinfile:
        dest: "{{ postgresql__install_base_path }}/postgresql.conf"
        regexp: "^#?include_dir.+$"
        line: "include_dir = 'conf.d'"
        state: present
        backup: yes

    - name: Create postgresql.conf from template
      template:
        src: postgresql-99-custom.conf.j2
        dest: "{{ postgresql__install_base_path }}/conf.d/99-custom.conf"
        backup: yes
        owner: "{{ postgresql__user }}"
        group: "{{ postgresql__group }}"
        mode: '0644'
      notify: restart postgresql

    - name: Configure host based authentication
      template:
        src: "pg_hba.conf.j2"
        dest: "{{ postgresql__install_base_path }}/pg_hba.conf"
        backup: yes
        owner: "{{ postgresql__user }}"
        group: "{{ postgresql__group }}"
        mode: '0644'
      when: postgresql__pg_hba_entries is defined

    - name: Validate PostgreSQL configuration
      become_user: "{{ postgresql__user }}"
      command: >
        {{ postgresql__bin_path }}/postgres
        -D {{ postgresql__data_work_dir }}
        -c config_file={{ postgresql__install_base_path }}/postgresql.conf
        -C config_file
      register: pg_conf_check
      changed_when: false
      failed_when: pg_conf_check.rc != 0
  notify: restart postgresql

