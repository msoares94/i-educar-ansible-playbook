---
- name: Select proper NGINX site config template
  set_fact:
    ieducar__nginx_template: >-
      nginx/ieducar-{{ ieducar__nginx_template_mode }}.conf.j2

- name: Ensure domain is defined when using SSL
  assert:
    that:
      - ieducar__name_domain is defined and ieducar__name_domain != ''
    fail_msg: "To use domain and SSL, you must define ieducar__name_domain."
  when: ieducar__with_domain | bool and ieducar__use_ssl | bool

- name: Ensure manual SSL cert paths are provided if Let's Encrypt is not used
  assert:
    that:
      - ieducar__ssl_certificate_src is defined
      - ieducar__ssl_certificate_key_src is defined
    fail_msg: "You must define certificate and key source files when using manual SSL."
  when:
    - ieducar__use_ssl | bool
    - not ieducar__use_letsencrypt | bool

- name: Validate domain format
  assert:
    that:
      - (ieducar__name_domain | default('')) is match("^[a-zA-Z0-9.-]+\\.[a-z]{2,}$")
    fail_msg: "Domain '{{ ieducar__name_domain }}' is invalid."
  when: ieducar__with_domain | bool

- name: Ensure certificate paths are set when not using Let's Encrypt
  assert:
    that:
      - ieducar__ssl_certificate_path is defined
      - ieducar__ssl_certificate_key_path is defined
    fail_msg: "Manual SSL selected but certificate paths not defined."
  when: ieducar__with_domain | bool and ieducar__use_ssl | bool and not ieducar__use_letsencrypt | bool

- name: Ensure Let's Encrypt email is defined
  assert:
    that:
      - ieducar_letsencrypt_email is defined
    fail_msg: "You must define ieducar_letsencrypt_email to use Let's Encrypt."
  when:
    - ieducar__use_ssl | bool
    - ieducar__use_letsencrypt | bool

- name: Assert email is not placeholder
  assert:
    that:
      - ieducar__letsencrypt_email is match("^[^@]+@[^@]+\.[^@]+$")
      - "'example.com' not in ieducar__letsencrypt_email"
    fail_msg: "Please provide a real email in 'ieducar_letsencrypt_email'. 'example.com' is not allowed."
  when:
    - ieducar__use_letsencrypt | bool

- name: Install Certbot
  become: true
  become_user: root
  apt:
    name: certbot
    state: present
  when:
    - ieducar__use_ssl | bool
    - ieducar__use_letsencrypt | bool

- name: Generate SSL certificate with Certbot
  become: true
  become_user: root
  command: certbot certonly --webroot -w {{ nginx__deploy_path }} -d {{ ieducar__name_domain }} --non-interactive --agree-tos -m {{ ieducar__letsencrypt_email }}
  when:
    - ieducar__use_ssl | bool
    - ieducar__use_letsencrypt | bool

- name: Ensure SSL certificate directories exist
  become: true
  become_user: root
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - "{{ ieducar__ssl_certificate_path | dirname }}"
    - "{{ ieducar__ssl_certificate_key_path | dirname }}"

- name: Upload manual SSL certificate and key
  become: true
  become_user: root
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0600'
  with_items:
    - { src: "{{ ieducar__ssl_certificate_src }}", dest: "{{ ieducar__ssl_certificate_path }}" }
    - { src: "{{ ieducar__ssl_certificate_key_src }}", dest: "{{ ieducar__ssl_certificate_key_path }}" }
  when:
    - ieducar__use_ssl | bool
    - not ieducar__use_letsencrypt | bool

- include_tasks: create_users.yml
- include_tasks: databases.yml
- include_tasks: grant_users.yml

- name: Setup cluster to default to UTF-8 | Restart PostgreSQL Cluster
  become: true
  become_user: root
  service:
    name: postgresql
    state: restarted

- name: Ensure i-Educar base path exists
  become: true
  become_user: root
  file:
    path: "{{ ieducar__base_path }}"
    state: directory
    owner: "{{ app__run_user }}"
    group: www-data
    mode: '0755'

- name: Git checkout i-Educar {{ ieducar__version }}
  git:
    repo: "{{ ieducar__url_repository }}"
    version: "{{ ieducar__version }}"
    dest: "{{ ieducar__base_path }}"
    force: yes
    update: no
    clone: yes

- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: '0755'

- name: Validate Composer installer hash
  shell: |
    HASH=$(curl -sS https://composer.github.io/installer.sig)
    php -r "if (hash_file('SHA384', '/tmp/composer-setup.php') === '$HASH') { echo 'Installer verified'; } else { echo 'Installer corrupt'; unlink('/tmp/composer-setup.php'); } echo PHP_EOL;"
  args:
    executable: /bin/bash

- name: Install Composer
  become: true
  become_user: root
  command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer --version={{ composer__version }}

- name: Create .env file from .env.example if not exists
  command: cp .env.example .env
  args:
    chdir: "{{ ieducar__base_path }}"
    creates: "{{ ieducar__base_path }}/.env"

- name: Set i-Educar permissions
  become_user: root
  block:
    - name: Set owner and group recursively
      file:
        path: "{{ ieducar__base_path }}"
        owner: "{{ app__run_user }}"
        group: www-data
        recurse: yes

    - name: Set setgid bit for group inheritance
      file:
        path: "{{ ieducar__base_path }}"
        mode: '2775'

    - name: Set default ACLs on i-Educar base path (user and group)
      ansible.posix.acl:
        path: "{{ ieducar__base_path }}"
        default: true
        entity: "{{ item.entity }}"
        etype: "{{ item.etype }}"
        permissions: "{{ item.permissions }}"
        state: present
      loop:
        - { entity: "{{ app__run_user }}", etype: user, permissions: rwx }
        - { entity: www-data, etype: group, permissions: rwx }
      loop_control:
        label: "{{ item.entity }}"

    - name: Set default ACLs on i-Educar base path (others)
      ansible.posix.acl:
        path: "{{ ieducar__base_path }}"
        default: true
        etype: other
        permissions: rx
        state: present

- name: Read values from environment
  shell: "source {{ env_path }}; echo ${{ item|upper }}"
  register: output
  loop: "{{ values }}"
  args:
    executable: /bin/bash
  changed_when: false

- name: Store read value
  set_fact:
    "{{ item.0 }}": "{{ item.1.stdout }}"
  when: item.0 is undefined
  with_together:
    - "{{ values }}"
    - "{{ output.results }}"
  changed_when: false

- name: Configure global settings i-Educar
  lineinfile:
    dest: "{{ ieducar__base_path }}/.env"
    backrefs: yes
    regexp: "^{{ item.option }}.+$"
    line: "{{ item.option }}={{ item.value }}"
    state: present
    backup: yes
  loop: "{{ ieducar__env_vars }}"
  loop_control:
    label: "{{ item.option }}"

- name: Deploy NGINX location snippet for i-Educar
  become_user: root
  template:
    src: nginx/snippets/ieducar-location-snippets.conf
    dest: "{{ nginx__config_path }}/snippets/ieducar-location-snippets.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Deploy i-Educar site config for NGINX
  become_user: root
  template:
    src: "{{ ieducar__nginx_template }}"
    dest: "{{ nginx__config_path }}/sites-available/ieducar.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Remove default NGINX site-enabled
  become_user: root
  file:
    path: "{{ nginx__config_path }}/sites-enabled/default"
    state: absent

- name: Add group to user {{ app__run_user }}
  become_user: root
  user:
    name: "{{ app__run_user }}"
    groups: "{{ item }}"
    append: yes
  loop:
    - www-data

- name: Enable site by creating symlink to sites-enabled
  become_user: root
  file:
    src: "{{ nginx__config_path }}/sites-available/ieducar.conf"
    dest: "{{ nginx__config_path }}/sites-enabled/ieducar.conf"
    state: link
  notify: restart nginx

- name: Run Laravel install command (Composer)
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_PROCESS_TIMEOUT: "900"
  args:
    chdir: "{{ ieducar__base_path }}"
    executable: /bin/bash
  shell: |
    composer new-install
  notify: restart ieducar

- name: Create symlink for Laravel storage if not exists
  command: php artisan storage:link
  args:
    chdir: "{{ ieducar__base_path }}"
    creates: "{{ ieducar__base_path }}/public/storage"
  notify: restart ieducar

- name: "Ensure storage/logs ACLs are correctly set for {{ app__run_user }} and www-data"
  become: true
  block:
    - name: "Ensure {{ app__run_user }} and www-data have access to storage/logs"
      ansible.posix.acl:
        path: "{{ ieducar__base_path }}/storage/logs"
        entity: "{{ item.entity }}"
        etype: "{{ item.etype }}"
        permissions: rwx
        state: present
        recursive: true
        default: true
      loop:
        - { entity: "{{ app__run_user }}", etype: user }
        - { entity: "www-data", etype: group }
      loop_control:
        label: "{{ item.entity }}"