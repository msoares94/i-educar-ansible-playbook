# roles/i-educar/defaults/main.yml

# If true, automatically confirm composer install prompts
ieducar__composer_allow_prompt: false

# Default NGINX domain and SSL behavior
ieducar__with_domain: "{{ ieducar_with_domain | default(false) }}"
ieducar__name_domain: "{{ ieducar_name_domain | default('') }}"

# SSL settings - use Let's Encrypt or custom certificates
letsencrypt__ssl: "{{ letsencrypt_ssl | default(false) }}"
letsencrypt__cert_name: "{{ letsencrypt_cert_name | default('') }}"

# Path to the .env file for i-Educar
env_path: "{{ ieducar__base_path }}/.env"

# List of .env keys to read and use for configuration
values:
  - APP_ENV
  - APP_DEBUG
  - DB_HOST
  - DB_PORT
  - DB_DATABASE
  - DB_USERNAME
  - DB_PASSWORD
  - APP_URL
  - APP_KEY
  - FILESYSTEM_DRIVER