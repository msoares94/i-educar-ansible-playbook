---
- name: restart nginx
  become: true
  become_user: root
  service:
    name: nginx
    state: restarted
    enabled: yes
  listen: restart ieducar

- name: restart php-fpm
  become: true
  become_user: root
  service:
    name: php{{ php__version }}-fpm
    state: restarted
    enabled: yes
  listen: restart ieducar

- name: restart postgresql
  become: true
  become_user: root
  service:
    name: postgresql
    state: restarted