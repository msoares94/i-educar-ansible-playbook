---
- name: Remove existing Report Package of i-Educar (if present)
  file:
    path: "{{ ieducar__base_path }}/packages/portabilis/i-educar-reports-package"
    state: absent
  when: ieducar__install_reports_package_community_edition | bool

- name: Git Checkout the Report Package of i-Educar {{ ieducar__version }}
  git:
    repo: "{{ ieducar__url_repository_reports_package_community_edition }}"
    version: "{{ ieducar__version_reports_package_community_edition }}"
    dest: "{{ ieducar__base_path }}/packages/portabilis/i-educar-reports-package"
    force: yes
    update: no
    clone: yes
  when: ieducar__install_reports_package_community_edition | bool

- name: Install the Report Package of i-Educar dependencies
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_PROCESS_TIMEOUT: "900"
  args:
    chdir: "{{ ieducar__base_path }}"
  command: composer update-install
  when: ieducar__install_reports_package_community_edition | bool

- name: Link community reports
  command: php artisan community:reports:link
  args:
    chdir: "{{ ieducar__base_path }}"
  when: ieducar__install_reports_package_community_edition | bool

- name: Compile community reports
  command: php artisan community:reports:install
  args:
    chdir: "{{ ieducar__base_path }}"
  when: ieducar__install_reports_package_community_edition | bool
  notify: restart ieducar

- name: Publish community reports
  command: php artisan vendor:publish --tag=reports-assets --ansi
  args:
    chdir: "{{ ieducar__base_path }}"
  when: ieducar__install_reports_package_community_edition | bool
  notify: restart ieducar

- name: Clear cache Report Package of i-Educar
  args:
    chdir: "{{ ieducar__base_path }}"
  command: php artisan cache:clear
  when: ieducar__install_reports_package_community_edition | bool